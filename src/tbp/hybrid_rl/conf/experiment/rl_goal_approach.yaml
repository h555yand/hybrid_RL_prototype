# @package _global_

defaults:
  - /logging: silent_warning_train

experiment:
  _target_: tbp.hybrid_rl.experiment.RLGoalApproachExperiment

  config:
    seed: 42
    # Visualization: null | text | pictures | video
    visualise: text
    regenerate_scripts: false
    do_train: false
    do_eval: false
    do_heur_eval: false
    do_bc_train: false
    do_sac_train: false
    do_sac_eval: true
    do_adaptive: false

    train_seeds: [11]
    eval_seeds: [44]
    sac_seed: 55
    sac_eval_seeds: [44]
    adapt_seed: 99

    promote_threshold: 0.7
    promote_window: 200

    curriculum_levels:
      - [10.0, 60.0]    # L0: same_side, no path_blocked
      - [10.0, 80.0]    # L1: same_side, path_blocked
      - [10.0, 120.0]   # L2: different sides

    curriculum_filters:
      - {same_side: true, path_blocked: false}
      - {same_side: true, path_blocked: true}
      - {same_side: false}

    # ═══════════════════════════════════════════
    # PHASE 1: Primitives (from scratch)
    # ═══════════════════════════════════════════
    training_stages:
      # ── Phase 1: Primitives ──
      - mesh: cube
        episodes: 1000
        epsilon_start: 1.0
        epsilon_min: 0.15
        load_mode: null
        warmup_episodes: 100
        promote_threshold: 0.85
        promote_window: 200
        curriculum_filters:
          - {same_side: true, path_blocked: false}
          - {same_side: true, path_blocked: true}
          - {}

      - mesh: sphere
        episodes: 1000
        epsilon_start: 1.0
        epsilon_min: 0.12
        load_mode: auto
        warmup_episodes: 80
        promote_threshold: 0.85
        promote_window: 200
        curriculum_filters:
          - {same_side: true, path_blocked: false}
          - {same_side: true, path_blocked: true}
          - {}

      - mesh: cylinder
        episodes: 1000
        epsilon_start: 1.0
        epsilon_min: 0.10
        load_mode: auto
        warmup_episodes: 80
        promote_threshold: 0.85
        promote_window: 200
        curriculum_filters:
          - {same_side: true, path_blocked: false}
          - {same_side: true, path_blocked: true}
          - {}

      - mesh: flat_square
        episodes: 1000
        epsilon_start: 1.0
        epsilon_min: 0.10
        load_mode: auto
        warmup_episodes: 80
        promote_threshold: 0.8
        promote_window: 200
        curriculum_filters:
          - {same_side: true, path_blocked: false}
          - {same_side: true, path_blocked: true}
          - {}
      
      - mesh: cone
        episodes: 1000
        epsilon_start: 1.0
        epsilon_min: 0.10
        load_mode: auto
        warmup_episodes: 80
        promote_threshold: 0.8
        promote_window: 200
        curriculum_filters:
          - {same_side: true, path_blocked: false}
          - {same_side: true, path_blocked: true}
          - {}

      - mesh: thin_cylinder
        episodes: 1000
        epsilon_start: 1.0
        epsilon_min: 0.10
        load_mode: auto
        warmup_episodes: 80
        promote_threshold: 0.85
        promote_window: 200
        curriculum_filters:
          - {same_side: true, path_blocked: false}
          - {same_side: true, path_blocked: true}
          - {}

      # ── Phase 2: Hollow objects ──
      - mesh: vase
        episodes: 2000
        epsilon_start: 1.0
        epsilon_min: 0.10
        load_mode: auto
        warmup_episodes: 100
        promote_threshold: 0.70
        promote_window: 300

      - mesh: mug
        episodes: 2000
        epsilon_start: 1.0
        epsilon_min: 0.10
        load_mode: auto
        warmup_episodes: 100
        promote_threshold: 0.7
        promote_window: 300

      # ── Phase 3: Reinforcement on new points ──
      - mesh: vase
        episodes: 1000
        epsilon_start: 0.3
        epsilon_min: 0.08
        load_mode: auto
        pool_seed: 201
        warmup_episodes: 30
        promote_threshold: 0.70
        promote_window: 200

      - mesh: mug
        episodes: 1000
        epsilon_start: 0.3
        epsilon_min: 0.08
        load_mode: auto
        pool_seed: 202
        warmup_episodes: 30
        promote_threshold: 0.7
        promote_window: 200

    # ═══════════════════════════════════════════
    # EVAL: train objects + held-out
    # ═══════════════════════════════════════════
    eval_meshes:
      # Train set — primitives
      - mesh: cube
        curriculum_filters:
          - {same_side: true, path_blocked: false}
          - {same_side: true, path_blocked: true}
          - {}
      - mesh: sphere
        curriculum_filters:
          - {same_side: true, path_blocked: false}
          - {same_side: true, path_blocked: true}
          - {}
      - mesh: cylinder
        curriculum_filters:
          - {same_side: true, path_blocked: false}
          - {same_side: true, path_blocked: true}
          - {}
      - mesh: flat_square
        curriculum_filters:
          - {same_side: true, path_blocked: false}
          - {same_side: true, path_blocked: true}
          - {}
      - mesh: cone
        curriculum_filters:
          - {same_side: true, path_blocked: false}
          - {same_side: true, path_blocked: true}
          - {}
      - mesh: thin_cylinder
        curriculum_filters:
          - {same_side: true, path_blocked: false}
          - {same_side: true, path_blocked: true}
          - {}
      # Train set — hollow
      - vase
      - mug
      # Held-out — hollow
      - mesh: cup
        pool_seed: 57

    eval_episodes_per_level: 100

    # BC config (not used in Q-only pipeline)
    # ═══ BC data collection ═══
    # Which meshes go into BC training data
    # Empty list = use all eval_meshes
    bc_mesh_names:
      - cube
      - sphere
      - cylinder
      - flat_square
      - cone
      - thin_cylinder
      - vase
      - mug

    # ═══ BC balancing ═══
    bc_total_target: null
    bc_mesh_weights:
      cube: 0.8         # простой, но даёт базовые навыки flat surface
      sphere: 0.8        # простой, curved surface — полезно для cone
      cylinder: 1.5      # edge traversal — ключевой для cone, thin_cylinder
      flat_square: 0.5   # очень простой, мало нового
      cone: 0.5
      thin_cylinder: 0.5
      vase: 2.0          # hollow навигация — ключевой для cup
      mug: 2.5           # самый сложный, handle+rim — максимум данных

    bc_level_weights:
      0: 1.0
      1: 1.5
      2: 2.0    # увеличил с 2.0 — L2 самый важный для генерализации
      
    bc_min_per_group: 50
    bc_action_min_pct: 0.01
    bc_action_min_absolute: 100
    bc_q_store_fraction: 0.3

    rl_config:
      state_dim: 22
      stuck_threshold: 0.05
      warmup_episodes: 100     # per level warmup
      air_start_enabled: true

      # Feature weights for HNSW stores
      feature_weights_free:
        3: 0.3
        4: 0.3
        5: 0.3
        6: 0.0
        7: 0.0
        8: 0.0
        9: 0.0
        10: 0.0
        11: 0.0
        12: 0.0
        19: 0.5
        20: 0.0
        21: 0.0
      feature_weights_surface:
        3: 0.0
        4: 0.0
        5: 0.0
        6: 0.1
        7: 0.1
        8: 0.1
        10: 0.1
        11: 0.0
        14: 0.0
        18: 0.3
        20: 1.5
        21: 1.5

      mode: train_adapt_epsilon
      goal_threshold: 4.0
      max_points: 500000
      k_neighbors: 7
      max_steps_per_goal: 500
      adaptive_sigma: true
      insert_threshold: 0.50
      auto_calibrate: false

      # Rewards
      reward_goal_reached: 30.0
      reward_timeout: -12.0
      reward_surface_violation: -12.0
      reward_step_penalty: -0.2
      reward_near_goal_on_surface: 0.5
      reward_progress: 3.0

      # Action space
      surface_step: 3.0
      free_step: 8.0
      free_step_small: 2.0
      rotation_step: 5.0
      num_actions: 24
      rotation_step_big: 15.0
      free_step_backward: 2.0

      # Tactical Q-store
      eval_epsilon: 0.02

      # Strategic Q-store
      strategic_eval_epsilon: 0.02
      strategic_reward_switch_success: 1.0
      strategic_reward_switch_wrong_side: -0.3
      strategic_reward_switch_collision: -0.5
      strategic_reward_stay_when_needed: -0.1
      strategic_reward_stay_correct: 0.3
      strategic_alpha_stay_multiplier: 0.1
      strategic_alpha_switch_multiplier: 1.0
      strategic_reward_stay_when_clear: -0.3
      strategic_reward_switch_when_clear: 0.3
      strategic_reward_stay_orbit_progress: 0.02
      strategic_reward_stay_orbit_stuck: -0.05
      strategic_reward_stay_should_have: 0.2

    # SAC (not used in Q-only pipeline)
    sac_config:
      load_mode: null
      goal_threshold: 4.0
      gamma: 0.99
      tau: 0.005
      lr_actor: 0.00003
      lr_critic: 0.0003
      batch_size: 256
      bc_lambda_init: 5.0
      bc_lambda_init: 5.0
      bc_lambda_min: 0.5
      actor_warmup_per_level: 50
      buffer_capacity: 1000000
      bc_reserve_fraction: 0.20
      max_steps_per_goal: 500
      eval_interval: 500
      eval_episodes: 50
      use_strategic_override: false
      use_cql: true
      cql_alpha: 1.0

    sac_episodes_per_mesh:
      cube: 500
      sphere: 500
      cylinder: 500
      flat_square: 500
      cone: 500
      thin_cylinder: 500
      vase: 1000
      mug: 1000

    sac_eval_episodes_per_level: 50

    adaptive_mesh: cup
    adaptive_episodes: 3000

    offline_check_window: 100


    logging:
      run_name: Q_generalization-v2-sac
      output_dir: ${oc.env:MONTY_LOGS}
