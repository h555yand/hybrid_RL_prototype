# @package _global_

defaults:
  - /logging: silent_warning_train

experiment:
  _target_: tbp.hybrid_rl.experiment.RLGoalApproachExperiment
  config:
    seed: 42
    visualise: false
    regenerate_scripts: false
    do_train: true
    do_eval: true
    do_heur_eval: false
    do_bc_train: false
    do_sac_train: false
    do_sac_eval: false
    do_adaptive: false

    train_seeds: [11]
    eval_seeds: [44]
    sac_eval_seeds: [77]
    sac_seed: 11
    promote_threshold: 0.35
    promote_window: 150

    curriculum_levels:
      - [10.0, 40.0]
      - [20.0, 80.0]
      - [40.0, 120.0]

    training_stages:
      - mesh: cube
        episodes: 5000
        epsilon_start: 1.0
        epsilon_min: 0.1
        load_mode: null

    eval_meshes: [cube]
    eval_episodes_per_level: 300

    rl_config:
      mode: train_adapt_epsilon
      goal_threshold: 4.0
      max_points: 500000
      k_neighbors: 7
      max_steps_per_goal: 500
      adaptive_sigma: true
      insert_threshold: 0.50
      auto_calibrate: false
      reward_goal_reached: 30.0
      reward_timeout: -12.0
      reward_surface_violation: -12.0
      reward_step_penalty: -0.2
      reward_near_goal_on_surface: 0.5
      reward_progress: 3.0
      surface_step: 3.0
      free_step: 8.0
      free_step_small: 2.0
      rotation_step: 5.0
      num_actions: 24
      rotation_step_big: 15.0
      free_step_backward: 2.0

    sac_config:
      load_mode: null
      goal_threshold: 4.0
      gamma: 0.99
      tau: 0.005
      lr_actor: 0.00003
      lr_critic: 0.0003
      batch_size: 256
      buffer_capacity: 500000
      bc_lambda_init: 5.0
      bc_lambda_decay: 0.99999
      max_steps_per_goal: 500
      eval_interval: 500
      eval_episodes: 50

    sac_meshes: [cube, mug]
    sac_episodes_per_mesh:
      cube: 1000
      mug: 2000
    sac_eval_episodes_per_level: 500

    adaptive_mesh: vase
    adaptive_episodes: 2000

    logging:
      run_name: rl_goal_approach
      output_dir: ${oc.env:MONTY_LOGS}
